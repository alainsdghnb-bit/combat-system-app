
name: Build Combat System APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'combat-system-github-upload.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Unpack Combat System source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf outer app-src
          mkdir outer app-src
          unzip -q combat-system-github-upload.zip -d outer
          INNER=$(find outer -type f -name 'combat-system-app-v1.0-rc1.zip' | head -1)
          test -n "$INNER"
          unzip -q "$INNER" -d app-src
          test -f app-src/combat-system-app-v1.0-rc1/android/app/build.gradle.kts
          test -f app-src/combat-system-app-v1.0-rc1/android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p app-src/combat-system-app-v1.0-rc1/android :app:assembleDebug --stacktrace

      - name: Prepare S25 test artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app-src/combat-system-app-v1.0-rc1/android/app/build/outputs/apk/debug/app-debug.apk release/CombatSystem-v1.0-RC1-S25-debug.apk
          sha256sum release/CombatSystem-v1.0-RC1-S25-debug.apk > release/SHA256.txt
          cat release/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CombatSystem-v1.0-RC1-S25-debug
          path: release/
          if-no-files-found: error
          retention-days: 30
